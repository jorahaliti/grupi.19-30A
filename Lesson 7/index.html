<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <fieldset>
        <legend>Personal info</legend>
    <form action="">
        <label for="firstname">First Name:</label> <br>
        <input type="text" id="firstname" name="firstname" value="Jora" readonly> <br>

         <label for="lastname">Last Name:</label> <br>
         <input type="text" id="lastname" name="lastname" disabled> <br>
        
        <label for="email">Email:</label> <br>
        <input type="text" id="email" name="email" maxlength="300"> <br>

        <label for="password">Password:</label> <br>
        <input type="text" id="password" name="password"> <br>

        <label for="age">Age:</label> <br>
        <input type="number" id="age" name="age" required> <br> <br>

       

        <label for="gender">Gender:</label> <br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female"> Female</label> <br>

         <input type="radio" id="fmale" name="gender" value="male">
        <label for="male"> Male</label> <br> <br>
        
        <label for="Hobbies">Hobbies:</label><br>
        <input type="checkbox" name="football" id="football" value="football">
        <label for="fotball">Football</label><br>

        <input type="checkbox" name="volleyball" id="volleyball" value="volleyball">
        <label for="volleyball">Volleyball</label><br>

        <input type="checkbox" name="chess" id="chess" value="chess">
        <label for="chess">Chess</label><br>

        <input type="checkbox" name="gaming" id="gaming" value="gaming">
        <label for="gaming">Gaming</label><br><br>

        <label>Choose your pet</label><br>
        <select>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="Bird">Bird</option>
            <option value="Monkey">Monkey</option>
        </select><br><br>

        <textarea name="message" id="message" rows="10" cols="20"></textarea>
        <br><br>
        <input type="submit" id="submit"> 

    </form>
    </fieldset>
</body>
</html>
