<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot coffee | ROASTIQ</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>
<section class="products">
    <h2>Hot Coffee</h2>

    <div class="product-container">


        <div class="product">
                <div class="coffee-icon">
                <img
                    src="https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?auto=format&fit=crop&w=500&q=80"
                    alt="Espresso coffee"
        >       </div>

                <h3>Espresso</h3>
                <p>Strong and rich coffee with a bold taste.</p>
                <span class="price">€2.00</span>
                <button>Order Now</button>
        </div>


        <div class="product">         
            <div class="coffee-icon">
                <img
                    src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=800&q=80"
                    alt="Latte Coffee">
            </div>

            <h3>Latte</h3>
            <p>Smooth coffee with warm steamed milk.</p>
            <span class="price">€3.50</span>
            <button>Order Now</button>
        </div>

        <div class="product">
            <div class="coffee-icon">
                <img
                    src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80"
                    alt="Americano Coffee">
            </div>

            <h3>Americano</h3>
            <p>Espresso mixed with hot water.</p>
            <span class="price">€2.50</span>
            <button>Order Now</button>
        </div>

    </div>
</section>
</body>
</html>
