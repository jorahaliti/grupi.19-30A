<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block and in line elements</title>
</head>
<body>
    <!--Block elements-->
    <h1>Hello first block element</h1>
    <h2>Hello second block element</h2>

    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Explicabo, eius.</p>
    
    <ul>
        <li>hello</li>
        <li>darkness</li>
        <li>my</li>
        <li>old</li>
        <li>friend</li>
    </ul>
<hr>
    <!--In line elements-->
    <img src="photo/matrix-2953869_1280.jpg" alt="matrix picture" width="200px" height="200px">

    <a href="https://shkolladigjitale.com/">Shkolla Digjitale</a>
    <cite>This is a cite</cite>
    <strong>This is strong element</strong>
    <span>This is span element</span>
</body>
</html>
